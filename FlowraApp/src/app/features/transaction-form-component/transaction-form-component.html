<div class="p-6 md:p-10 max-w-3xl mx-auto min-h-screen animate-fade-in">

  <div class="mb-8">
    <button (click)="goBack()" class="text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 flex items-center gap-2 mb-4 transition-colors font-medium">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Geri Dön
    </button>
    <h1 class="text-3xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">Yeni İşlem Ekle</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-1">Gelir veya gider detaylarını sisteme girin.</p>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden relative">

    <!-- Dekoratif Arka Plan Işığı -->
    <div class="absolute top-0 right-0 w-64 h-64 opacity-20 dark:opacity-10 rounded-full blur-3xl pointer-events-none transition-colors duration-700"
         [ngClass]="transactionType === 'expense' ? 'bg-rose-500' : 'bg-emerald-500'">
    </div>

    <!-- Sekmeler -->
    <div class="flex p-4 gap-4 bg-slate-50/50 dark:bg-slate-900/50 border-b border-slate-100 dark:border-slate-700 relative z-10">
      <button
        (click)="setTransactionType('expense')"
        class="flex-1 flex items-center justify-center gap-3 py-4 rounded-2xl font-bold transition-all"
        [ngClass]="transactionType === 'expense'
                   ? 'bg-rose-500 text-white shadow-md shadow-rose-500/20'
                   : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'">
        <div class="w-8 h-8 rounded-full flex items-center justify-center" [ngClass]="transactionType === 'expense' ? 'bg-white/20' : 'bg-rose-100 dark:bg-rose-900/30 text-rose-500'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </div>
        Gider Ekle
      </button>
      <button
        (click)="setTransactionType('income')"
        class="flex-1 flex items-center justify-center gap-3 py-4 rounded-2xl font-bold transition-all"
        [ngClass]="transactionType === 'income'
                   ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/20'
                   : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'">
        <div class="w-8 h-8 rounded-full flex items-center justify-center" [ngClass]="transactionType === 'income' ? 'bg-white/20' : 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-500'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </div>
        Gelir Ekle
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()" class="p-6 md:p-8 space-y-8 relative z-10">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 pl-1">İşlem Adı</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <input type="text" formControlName="name" placeholder="Örn: Maaş, Kira, Market..."
                   class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
          </div>
        </div>
        <div class="mt-1">
          <app-currency-input-component
            [label]="'Tutar'"
            [control]="$any(transactionForm.get('amount'))"
            [allowNegative]="false">
          </app-currency-input-component>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 pl-1">Tarih</label>
        <input type="date" formControlName="date"
               class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
      </div>

      @if (transactionType === 'expense') {
        <div class="p-6 bg-slate-50/80 dark:bg-slate-900/40 rounded-2xl space-y-5 border border-slate-200/60 dark:border-slate-700/60">
          <label class="flex items-center gap-4 cursor-pointer group">
            <div class="relative inline-flex items-center">
              <input type="checkbox" formControlName="isCreditCard" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-300 dark:bg-slate-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
            <div>
              <span class="block text-sm font-bold text-slate-700 dark:text-slate-200">Bu bir kredi kartı borcu mu?</span>
              <span class="block text-xs text-slate-500 dark:text-slate-400 mt-0.5">Eğer evet ise, asgari ödeme tutarı da girebilirsiniz.</span>
            </div>
          </label>

          @if (transactionForm.get('isCreditCard')?.value) {
            <div class="pt-4 border-t border-slate-200 dark:border-slate-700 animate-fade-in">
              <div class="mt-2">
                <app-currency-input-component
                  [label]="'Asgari Ödeme Tutarı'"
                  [control]="$any(transactionForm.get('minimumPaymentAmount'))"
                  [allowNegative]="false"
                  placeholder="Asgari tutarı girin...">
                </app-currency-input-component>
              </div>
              <p class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mt-2 pl-1 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Dashboard hesaplamalarında kalan bakiyeyi bulmak için bu tutar baz alınacaktır.
              </p>
            </div>
          }
        </div>
      }

      <label class="flex items-center gap-4 cursor-pointer p-5 rounded-2xl border transition-colors"
             [ngClass]="transactionForm.get('isRecurring')?.value ? 'border-indigo-200 dark:border-indigo-500/30 bg-indigo-50/50 dark:bg-indigo-900/20' : 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800'">
        <div class="relative inline-flex items-center">
          <input type="checkbox" formControlName="isRecurring" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-300 dark:bg-slate-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
        </div>
        <div>
          <span class="block text-sm font-bold text-slate-700 dark:text-slate-200">Her ay tekrarlanan bir işlem mi?</span>
          <span class="block text-xs text-slate-500 dark:text-slate-400 mt-0.5">Gelecek projeksiyonları ve maaş/kira takibi için seçin.</span>
        </div>
      </label>

      <div class="pt-6">
        <button type="submit" [disabled]="transactionForm.invalid"
                class="w-full py-4 rounded-2xl text-white font-bold text-lg transition-all shadow-lg flex items-center justify-center gap-3 group disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none"
                [ngClass]="transactionType === 'expense'
                           ? 'bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 shadow-rose-600/30'
                           : 'bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 shadow-emerald-600/30'">
          @if (transactionType === 'expense') {
            <svg class="w-6 h-6 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Gideri Kaydet
          } @else {
            <svg class="w-6 h-6 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Geliri Kaydet
          }
        </button>
      </div>

    </form>
  </div>
</div>
