@if (confirmModal.state(); as modal) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-[9998] flex items-center justify-center p-4
           bg-slate-900/60 dark:bg-black/70 backdrop-blur-md
           animate-in fade-in duration-200"
    (click)="confirmModal.cancel()">

    <!-- Panel -->
    <div
      class="relative w-full max-w-md bg-white dark:bg-slate-900
             rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800
             animate-in zoom-in-95 duration-200"
      (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="flex items-start justify-between p-6 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-3">

          <!-- Icon based on type -->
          @if (modal.type === 'danger') {
            <div class="w-10 h-10 rounded-xl bg-rose-100 dark:bg-rose-900/30 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </div>
          } @else if (modal.type === 'warning') {
            <div class="w-10 h-10 rounded-xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
            </div>
          } @else {
            <div class="w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
          }

          <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 leading-tight">
            {{ modal.title }}
          </h3>
        </div>

        <button
          (click)="confirmModal.cancel()"
          class="ml-4 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:text-slate-500
                 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700
                 transition-colors shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
          {{ modal.message }}
        </p>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 pb-6">
        <button
          id="confirm-modal-cancel"
          (click)="confirmModal.cancel()"
          class="px-5 py-2.5 rounded-xl text-sm font-semibold
                 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300
                 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
          {{ modal.cancelText }}
        </button>

        <button
          id="confirm-modal-confirm"
          (click)="confirmModal.confirm()"
          class="px-5 py-2.5 rounded-xl text-sm font-bold text-white transition-all
                 shadow-lg active:scale-95"
          [class]="modal.type === 'danger'
                    ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-600/30'
                    : modal.type === 'warning'
                    ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/30'
                    : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/30'">
          {{ modal.confirmText }}
        </button>
      </div>

    </div>
  </div>
}
