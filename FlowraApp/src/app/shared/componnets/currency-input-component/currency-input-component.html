<div class="relative w-full">
  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
    {{ label }}
  </label>

  <div class="relative">
    <input
      type="text"
      [formControl]="displayControl"
      [placeholder]="placeholder"
      (blur)="onBlur()"
      class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 shadow-sm relative z-0 text-right"
      [ngClass]="{
        'border-red-400 focus:border-red-500 focus:ring-red-500 dark:border-red-500/50': isInvalid
      }">
  </div>

  <div class="h-5 mt-1.5 px-1">
    <p *ngIf="errorMessage" class="text-xs text-red-500 animate-pulse transition-opacity">
      {{ errorMessage }}
    </p>
  </div>
</div>
