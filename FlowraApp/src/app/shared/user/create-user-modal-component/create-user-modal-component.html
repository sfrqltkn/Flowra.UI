<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-xl animate-in zoom-in-95 duration-200">

    <div class="flex justify-between items-start mb-6">
      <div>
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Yeni Kullanıcı Ekle</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kullanıcıya sistem tarafından şifre atanıp e-posta ile iletilecektir.</p>
      </div>
      <button (click)="close.emit(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="grid grid-cols-2 gap-4">
        <app-base-input-component
          label="Ad"
          [control]="getControl('firstName')"
          icon="fas fa-user">
        </app-base-input-component>

        <app-base-input-component
          label="Soyad"
          [control]="getControl('lastName')"
          icon="fas fa-user">
        </app-base-input-component>
      </div>

      <app-base-input-component
        label="E-posta Adresi"
        type="email"
        [control]="getControl('email')"
        icon="fas fa-envelope"
        placeholder="ornek@europowerenerji.com.tr">
      </app-base-input-component>

      <div class="flex gap-3 mt-8">
        <button type="button" (click)="close.emit(false)" class="flex-1 px-4 py-2 text-sm font-medium bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
          İptal
        </button>
        <app-custom-button-component type="submit" variant="primary">
          Oluştur
        </app-custom-button-component>
      </div>

    </form>
  </div>
</div>
